server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://localhost:5432/credentials
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: true
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 500ms
