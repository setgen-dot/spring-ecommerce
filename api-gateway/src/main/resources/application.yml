server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/v1/categories/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/carts/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - RewritePath=/auth/v3/api-docs, /v3/api-docs

            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/users/v3/api-docs
              filters:
                - RewritePath=/users/v3/api-docs, /v3/api-docs

            - id: category-service-docs
              uri: lb://category-service
              predicates:
                - Path=/categories/v3/api-docs
              filters:
                - RewritePath=/categories/v3/api-docs, /v3/api-docs

            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/products/v3/api-docs
              filters:
                - RewritePath=/products/v3/api-docs, /v3/api-docs

            - id: cart-service-docs
              uri: lb://cart-service
              predicates:
                - Path=/carts/v3/api-docs
              filters:
                - RewritePath=/carts/v3/api-docs, /v3/api-docs

            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/orders/v3/api-docs
              filters:
                - RewritePath=/orders/v3/api-docs, /v3/api-docs

            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/payments/v3/api-docs
              filters:
                - RewritePath=/payments/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: User Service
        url: /users/v3/api-docs
      - name: Category Service
        url: /categories/v3/api-docs
      - name: Product Service
        url: /products/v3/api-docs
      - name: Cart Service
        url: /carts/v3/api-docs
      - name: Order Service
        url: /orders/v3/api-docs
      - name: Payment Service
        url: /payments/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost